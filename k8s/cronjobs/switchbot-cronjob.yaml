apiVersion: batch/v1
kind: CronJob
metadata:
  name: switchbot-collector
  namespace: monitoring
spec:
  schedule: "*/1 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 55
      template:
        spec:
          restartPolicy: OnFailure
          containers:
          - name: collector
            image: localhost/switchbot-collector:1.0
            imagePullPolicy: Never
            env:
            - name: SWITCHBOT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: switchbot-secret
                  key: SWITCHBOT_TOKEN
            - name: DEVICES_FILE
              value: /config/devices.json
            - name: PUSHGATEWAY_URL
              value: http://pushgateway.monitoring.svc:9091
            volumeMounts:
            - name: device-config
              mountPath: /config
              readOnly: true
          volumes:
          - name: device-config
            configMap:
              name: switchbot-devices
